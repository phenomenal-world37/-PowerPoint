<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="160" y="100" font-size="44" fill="#222">六方最密堆积 — HCP</text>
  <text x="160" y="160" font-size="28" fill="#444">特点：六方晶格，两层交错堆积，配位数 12。</text>
  <g transform="translate(420,260) scale(1.6)">
    <!-- top hexagon -->
    <polygon points="120,10 240,70 240,190 120,250 0,190 0,70" fill="none" stroke="#00aaff" stroke-width="4"/>
    <!-- bottom hexagon shifted down -->
    <g transform="translate(0,80)">
      <polygon points="120,10 240,70 240,190 120,250 0,190 0,70" fill="none" stroke="#00aaff" stroke-width="3"/>
    </g>
    <!-- atoms: approximate positions -->
    <circle cx="120" cy="10" r="10" fill="#ffcc00"/>
    <circle cx="240" cy="70" r="10" fill="#ffcc00"/>
    <circle cx="240" cy="190" r="10" fill="#ffcc00"/>
    <circle cx="120" cy="250" r="10" fill="#ffcc00"/>
    <circle cx="0" cy="190" r="10" fill="#ffcc00"/>
    <circle cx="0" cy="70" r="10" fill="#ffcc00"/>
  </g>
  <text x="160" y="760" font-size="28" fill="#333">典型实例：镁、钛的某些同素异性体</text>
  <text x="160" y="820" font-size="24" fill="#666">配位数：12 ； 高堆积密度</text>
</svg>