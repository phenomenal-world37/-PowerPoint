<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="160" y="100" font-size="44" fill="#222">简单立方 — Simple Cubic (SC)</text>
  <text x="160" y="160" font-size="28" fill="#444">特点：原子位于立方体的8个角，配位数 6，堆积密度较低。</text>
  <!-- schematic: cube corners -->
  <g transform="translate(420,240) scale(2)">
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#00aaff" stroke-width="4"/>
    <!-- corner atoms -->
    <circle cx="0" cy="0" r="10" fill="#ffcc00"/>
    <circle cx="200" cy="0" r="10" fill="#ffcc00"/>
    <circle cx="0" cy="200" r="10" fill="#ffcc00"/>
    <circle cx="200" cy="200" r="10" fill="#ffcc00"/>
    <!-- pseudo 3D: top face shifted -->
    <g transform="translate(40,-40)">
      <rect x="0" y="0" width="200" height="200" fill="none" stroke="#00aaff" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#ffcc00"/>
      <circle cx="200" cy="0" r="10" fill="#ffcc00"/>
      <circle cx="0" cy="200" r="10" fill="#ffcc00"/>
      <circle cx="200" cy="200" r="10" fill="#ffcc00"/>
      <line x1="0" y1="0" x2="40" y2="-40" stroke="#00aaff" stroke-width="2"/>
      <line x1="200" y1="0" x2="240" y2="-40" stroke="#00aaff" stroke-width="2"/>
      <line x1="0" y1="200" x2="40" y2="160" stroke="#00aaff" stroke-width="2"/>
      <line x1="200" y1="200" x2="240" y2="160" stroke="#00aaff" stroke-width="2"/>
    </g>
  </g>
  <text x="160" y="760" font-size="28" fill="#333">典型实例：很少见，理想模型用于教学。</text>
  <text x="160" y="820" font-size="24" fill="#666">配位数：6 ； 原胞中原子数：1（角占1/8）</text>
</svg>