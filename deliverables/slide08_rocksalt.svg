<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="160" y="100" font-size="44" fill="#222">岩盐型 — NaCl (Rocksalt)</text>
  <text x="160" y="160" font-size="28" fill="#444">特点：两种离子交替占据 FCC 点阵位置，配位数 6。</text>
  <g transform="translate(420,240) scale(2)">
    <!-- cube with two atom types -->
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#00aaff" stroke-width="4"/>
    <circle cx="0" cy="0" r="10" fill="#ffcc00"/>
    <circle cx="200" cy="0" r="10" fill="#ffcc00"/>
    <circle cx="0" cy="200" r="10" fill="#ffcc00"/>
    <circle cx="200" cy="200" r="10" fill="#ffcc00"/>
    <circle cx="100" cy="100" r="12" fill="#66ccff"/>
  </g>
  <text x="160" y="760" font-size="28" fill="#333">典型实例：NaCl（食盐晶体）</text>
  <text x="160" y="820" font-size="24" fill="#666">配位数：6 ； 离子晶体</text>
</svg>