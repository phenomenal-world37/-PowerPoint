<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="160" y="100" font-size="44" fill="#222">CsCl 型晶格 — CsCl</text>
  <text x="160" y="160" font-size="28" fill="#444">特点：简单立方点阵上有体心不同种离子，配位数 8。</text>
  <g transform="translate(420,240) scale(2)">
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#00aaff" stroke-width="4"/>
    <circle cx="0" cy="0" r="10" fill="#ffcc00"/>
    <circle cx="200" cy="0" r="10" fill="#ffcc00"/>
    <circle cx="0" cy="200" r="10" fill="#ffcc00"/>
    <circle cx="200" cy="200" r="10" fill="#ffcc00"/>
    <circle cx="100" cy="100" r="14" fill="#66ccff"/>
  </g>
  <text x="160" y="760" font-size="28" fill="#333">典型实例：CsCl（某些盐类高温相）</text>
  <text x="160" y="820" font-size="24" fill="#666">配位数：8 ； 离子晶体</text>
</svg>