<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="160" y="100" font-size="44" fill="#222">体心立方 — Body-Centered Cubic (BCC)</text>
  <text x="160" y="160" font-size="28" fill="#444">特点：角位与一个体心原子，配位数 8。</text>
  <g transform="translate(420,240) scale(2)">
    <!-- cube outline -->
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#00aaff" stroke-width="4"/>
    <!-- corner atoms -->
    <circle cx="0" cy="0" r="10" fill="#66ccff"/>
    <circle cx="200" cy="0" r="10" fill="#66ccff"/>
    <circle cx="0" cy="200" r="10" fill="#66ccff"/>
    <circle cx="200" cy="200" r="10" fill="#66ccff"/>
    <!-- body center -->
    <circle cx="100" cy="100" r="14" fill="#ff9966"/>
    <!-- pseudo 3D top shifted -->
    <g transform="translate(40,-40)">
      <rect x="0" y="0" width="200" height="200" fill="none" stroke="#00aaff" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#66ccff"/>
      <circle cx="200" cy="0" r="10" fill="#66ccff"/>
      <circle cx="0" cy="200" r="10" fill="#66ccff"/>
      <circle cx="200" cy="200" r="10" fill="#66ccff"/>
      <line x1="0" y1="0" x2="40" y2="-40" stroke="#00aaff" stroke-width="2"/>
    </g>
  </g>
  <text x="160" y="760" font-size="28" fill="#333">典型实例：α-铁（在室温下的结构之一）</text>
  <text x="160" y="820" font-size="24" fill="#666">配位数：8 ； 原胞中原子数：2</text>
</svg>