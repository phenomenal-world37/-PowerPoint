<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="160" y="100" font-size="44" fill="#222">面心立方 — Face-Centered Cubic (FCC)</text>
  <text x="160" y="160" font-size="28" fill="#444">特点：角位与面心位，配位数 12，高堆积密度。</text>
  <g transform="translate(420,240) scale(2)">
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#00aaff" stroke-width="4"/>
    <!-- corner atoms -->
    <circle cx="0" cy="0" r="8" fill="#ffcc00"/>
    <circle cx="200" cy="0" r="8" fill="#ffcc00"/>
    <circle cx="0" cy="200" r="8" fill="#ffcc00"/>
    <circle cx="200" cy="200" r="8" fill="#ffcc00"/>
    <!-- face centers -->
    <circle cx="100" cy="0" r="10" fill="#66ccff"/>
    <circle cx="100" cy="200" r="10" fill="#66ccff"/>
    <circle cx="0" cy="100" r="10" fill="#66ccff"/>
    <circle cx="200" cy="100" r="10" fill="#66ccff"/>
  </g>
  <text x="160" y="760" font-size="28" fill="#333">典型实例：铜、铝、镍等金属多数在常温下为 FCC</text>
  <text x="160" y="820" font-size="24" fill="#666">配位数：12 ； 原胞中原子数：4</text>
</svg>