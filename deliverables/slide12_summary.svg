<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="160" y="100" font-size="44" fill="#222">总结与参考</text>
  <text x="160" y="180" font-size="28" fill="#333">总结：</text>
  <text x="180" y="230" font-size="24" fill="#444">• SC/BCC/FCC 为三种常见立方晶格（配位数分别为6/8/12）。</text>
  <text x="180" y="270" font-size="24" fill="#444">• HCP 与 FCC 为最密堆积结构，堆积密度高。</text>
  <text x="180" y="310" font-size="24" fill="#444">• 离子晶体（NaCl, CsCl, Fluorite）与共价网络（Diamond）有明显不同的配位与性质。</text>
  <text x="160" y="760" font-size="20" fill="#666">参考文献：教科书与公开资料（略）</text>
  <text x="160" y="820" font-size="20" fill="#666">交互演示（在线）： https://phenomenal-world37.github.io/-PowerPoint/</text>
