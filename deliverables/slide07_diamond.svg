<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="160" y="100" font-size="44" fill="#222">钻石型晶格 — Diamond Cubic</text>
  <text x="160" y="160" font-size="28" fill="#444">特点：衍生自 FCC，但每个原子与四个最近邻形成四面体共价键。</text>
  <g transform="translate(420,240) scale(2)">
    <!-- simplified motif -->
    <circle cx="60" cy="60" r="12" fill="#ffcc00"/>
    <circle cx="140" cy="140" r="12" fill="#ffcc00"/>
    <line x1="60" y1="60" x2="140" y2="140" stroke="#999" stroke-width="4"/>
    <circle cx="140" cy="60" r="8" fill="#66ccff"/>
    <circle cx="60" cy="140" r="8" fill="#66ccff"/>
  </g>
  <text x="160" y="760" font-size="28" fill="#333">典型实例：单晶硅、钻石（C）</text>
  <text x="160" y="820" font-size="24" fill="#666">配位数：4 ； 共价网络结构</text>
</svg>